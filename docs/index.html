<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GZG MINERALES</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#121418">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GZG MINERALES">
  <meta name="application-name" content="GZG MINERALES">
  
  <link rel="manifest" href="manifest.json?v=35">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-192.png?v=35">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=35">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png?v=35">
  <link rel="shortcut icon" href="assets/favicon.png?v=35">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100dvh;
      background-color: #121418;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #121418;
    }

    #app-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: calc(100% + 44px);
      border: 0;
      outline: 0;
      display: block;
      background-color: #121418;
      opacity: 0;
      transition: opacity 0.4s ease-in;
    }

    #app-frame.visible {
      opacity: 1;
    }

    /* Splash Screen Corporativo GZG */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background-color: #121418;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.45s ease-out;
    }

    #loading-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: 82px;
      height: 82px;
      margin-bottom: 16px;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.8));
    }

    .splash-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
      color: #FFFFFF;
    }

    .splash-title span {
      color: #F58220;
    }

    .splash-subtitle {
      font-size: 10px;
      font-weight: 700;
      color: #A0A5B1;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(245, 130, 32, 0.2);
      border-top-color: #F58220;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Overlay Splash Screen que cubre todo el arranque hasta que Streamlit avisa que está listo -->
  <div id="loading-overlay">
    <img src="assets/gzg_logo_transparent.png" class="splash-logo" alt="GZG Logo" onerror="this.src='assets/icon-192.png'">
    <div class="splash-title">GZG <span>MINERALES</span></div>
    <div class="splash-subtitle">CONTROL DE HORAS EXTRAS</div>
    <div class="spinner"></div>
  </div>

  <div id="app-container">
    <iframe 
      id="app-frame" 
      src="https://gzg-aprobaciones-movil.streamlit.app/?embed=true"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write">
    </iframe>
  </div>

  <script>
    const VAPID_PUB_KEY = "BMo0zqUy8r8mFzeq69TRlqVCb3E_uC0d_xExa-bFr_RJ3FG8iBj9TqtLxSEIb5GrV5GXj0T_PPhV0z-0Fz59gAM";

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    let swRegistration = null;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=36').then(function(reg) {
        swRegistration = reg;
        reg.update();
      }).catch(function(e) {
        console.log('SW register error:', e);
      });
    }

    // Escuchar peticiones de suscripción Push y señal de arranque de Streamlit
    window.addEventListener('message', async function(ev) {
      if (ev.data && ev.data.type === 'gzg:ready') {
        showApp();
      }
      if (ev.data && ev.data.type === 'GZG_REQUEST_PUSH') {
        try {
          const perm = await Notification.requestPermission();
          if (perm !== 'granted') return;
          const reg = await navigator.serviceWorker.ready;
          let sub = await reg.pushManager.getSubscription();
          if (!sub) {
            sub = await reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(ev.data.vapid_pub || VAPID_PUB_KEY)
            });
          }
          if (ev.source) {
            ev.source.postMessage({ type: 'GZG_PUSH_SUB_SUCCESS', sub: JSON.stringify(sub) }, '*');
          }
          const iframe = document.getElementById('app-frame');
          if (iframe && iframe.contentWindow && iframe.contentWindow !== ev.source) {
            iframe.contentWindow.postMessage({ type: 'GZG_PUSH_SUB_SUCCESS', sub: JSON.stringify(sub) }, '*');
          }
        } catch (err) {
          console.error('Error suscribiendo push:', err);
        }
      }
    });

    var overlay = document.getElementById('loading-overlay');
    var frame = document.getElementById('app-frame');
    var shown = false;

    function showApp() {
      if (shown) return;
      shown = true;
      frame.classList.add('visible');
      overlay.classList.add('fade-out');
      setTimeout(function() {
        overlay.style.display = 'none';
      }, 350);
    }

    // Fallback de seguridad: si por algo la señal real nunca llega,
    // revela a los 4s para no dejar a nadie atrapado en el splash.
    setTimeout(showApp, 4000);
  </script>
</body>
</html>
