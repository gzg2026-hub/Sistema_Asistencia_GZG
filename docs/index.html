<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GZG MINERALES - Aprobaciones</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#121418">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GZG MINERALES">
  <meta name="application-name" content="GZG MINERALES">
  
  <link rel="manifest" href="manifest.json?v=18">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-192.png?v=18">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=18">
  <link rel="shortcut icon" href="assets/favicon.png?v=18">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #121418;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #121418;
    }

    #app-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: calc(100% + 44px);
      border: 0;
      outline: 0;
      display: block;
      background-color: #121418;
    }

    /* Botón flotante discreto para Actualizar / Refrescar */
    #btn-refresh {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 999999;
      background: rgba(30, 34, 45, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #F58220;
      border: 1px solid rgba(245, 130, 32, 0.35);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    #btn-refresh:active {
      transform: scale(0.90) rotate(180deg);
      background: rgba(245, 130, 32, 0.25);
    }
  </style>
</head>
<body>
  <div id="app-container">
    <iframe 
      id="app-frame" 
      src="https://gzg-aprobaciones-movil.streamlit.app/?embed=true"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write">
    </iframe>
  </div>

  <!-- Botón flotante para actualización instantánea en celular -->
  <button id="btn-refresh" title="Actualizar datos" aria-label="Actualizar datos">
    🔄
  </button>

  <script>
    const frame = document.getElementById('app-frame');
    const btnRef = document.getElementById('btn-refresh');

    btnRef.addEventListener('click', () => {
      btnRef.style.transform = 'rotate(360deg)';
      try {
        frame.contentWindow.location.reload();
      } catch (e) {
        frame.src = frame.src;
      }
      setTimeout(() => {
        btnRef.style.transform = 'none';
      }, 500);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=18').then(reg => {
        reg.update();
      }).catch(() => {});
    }
  </script>
</body>
</html>
