<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GZG MINERALES</title>
  <meta name="theme-color" content="#121418">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GZG MINERALES">
  <meta name="application-name" content="GZG MINERALES">
  <link rel="manifest" href="manifest.json?v=6">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-192.png?v=6">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=6">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png?v=6">
  <link rel="shortcut icon" href="assets/favicon.png?v=6">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #121418;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Contenedor que recorta la barra inferior de Streamlit */
    #app-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #121418;
    }

    iframe {
      width: 100%;
      height: calc(100% + 46px);
      border: none;
      display: block;
      background: #121418;
      margin-bottom: -46px;
    }

    /* Barra flotante superior de instalación (discreta y cerrable) */
    #install-bar {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26, 29, 36, 0.95);
      border: 1px solid rgba(245, 130, 32, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      z-index: 1000;
    }

    #install-bar button.action {
      background: #F58220;
      color: #FFFFFF;
      border: none;
      padding: 6px 14px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    #install-bar button.close {
      background: transparent;
      border: none;
      color: #8E929B;
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
    }

    @media (display-mode: standalone) {
      #install-bar { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- Barra de instalación discreta superior -->
  <div id="install-bar">
    <span>📲 Instalar <b>GZG MINERALES</b></span>
    <button class="action" onclick="installPWA()">Instalar</button>
    <button class="close" onclick="closeBar()">✕</button>
  </div>

  <!-- Iframe directo con scroll habilitado -->
  <div id="app-box">
    <iframe
      id="st-frame"
      src="https://gzg-aprobaciones-movil.streamlit.app/?embed=true&embed_options=hide_footer"
      allow="camera;microphone;geolocation;clipboard-read;clipboard-write">
    </iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => r.update());
      });
      navigator.serviceWorker.register('sw.js?v=6').catch(() => {});
    }

    // PWA Install
    let prompt;
    const bar = document.getElementById('install-bar');
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      prompt = e;
      bar.style.display = 'flex';
    });

    function installPWA() {
      if (prompt) {
        prompt.prompt();
        prompt.userChoice.then(() => {
          bar.style.display = 'none';
          prompt = null;
        });
      }
    }

    function closeBar() {
      bar.style.display = 'none';
    }

    window.addEventListener('appinstalled', () => {
      bar.style.display = 'none';
    });
  </script>
</body>
</html>
