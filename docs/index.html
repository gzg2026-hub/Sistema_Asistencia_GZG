<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GZG MINERALES - Redireccionando al Sistema Unificado</title>
  <meta http-equiv="refresh" content="0; url=https://chronic-acid-ooo-divide.trycloudflare.com/">
  <meta name="theme-color" content="#121418">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121418;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1A1D24;
      border: 1px solid #2A2F3D;
      border-radius: 16px;
      padding: 30px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 20px; font-weight: 800; color: #FFFFFF; margin-bottom: 10px; }
    p { font-size: 13.5px; color: #94A3B8; line-height: 1.55; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #F58220 0%, #D35400 100%);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      padding: 14px 0;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(245, 130, 32, 0.4);
      transition: transform 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .loader {
      margin: 16px auto 0;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(245,130,32,0.2);
      border-top-color: #F58220;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    const NUEVA_URL = "https://chronic-acid-ooo-divide.trycloudflare.com/";

    // Limpiar service workers antiguos para que no sirvan contenido viejo
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // Redirigir de inmediato al nuevo sistema unificado
    try {
      if (window.top && window.top.location) {
        window.top.location.replace(NUEVA_URL);
      } else {
        window.location.replace(NUEVA_URL);
      }
    } catch(e) {
      window.location.href = NUEVA_URL;
    }
  </script>
</head>
<body>
  <div class="card">
    <div class="icon">⚖️</div>
    <h1>SISTEMA MIGRADO Y UNIFICADO</h1>
    <p>
      La versión anterior ha sido <b>desactivada</b>.<br><br>
      Todo el control (Asistencia + Balanza) funciona ahora en la nueva plataforma de alta velocidad.
    </p>
    <a href="https://chronic-acid-ooo-divide.trycloudflare.com/" class="btn">
      🚀 Abrir Nueva Plataforma GZG
    </a>
    <div class="loader"></div>
  </div>
</body>
</html>
