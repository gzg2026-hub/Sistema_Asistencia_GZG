<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GZG MINERALES - Aprobaciones</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#121418">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GZG MINERALES">
  <meta name="application-name" content="GZG MINERALES">
  
  <link rel="manifest" href="manifest.json?v=18">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-192.png?v=18">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=18">
  <link rel="shortcut icon" href="assets/favicon.png?v=18">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #121418;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #121418;
    }

    #app-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: calc(100% + 44px);
      border: 0;
      outline: 0;
      display: block;
      background-color: #121418;
    }

    /* Overlay oscuro que cubre el iframe mientras carga — elimina el flash blanco */
    #loading-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100dvh;
      background: #121418;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      transition: opacity 0.3s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Spinner GZG */
    .gzg-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(245,130,32,0.2);
      border-top: 3px solid #F58220;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .gzg-label {
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <!-- Overlay de carga que oculta el flash blanco del iframe -->
  <div id="loading-overlay">
    <div class="gzg-spinner"></div>
    <div class="gzg-label">GZG MINERALES</div>
  </div>

  <div id="app-container">
    <iframe 
      id="app-frame" 
      src="https://gzg-aprobaciones-movil.streamlit.app/?embed=true"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write">
    </iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=35').then(reg => {
        reg.update();
      }).catch(() => {});
    }

    // Ocultar overlay cuando el iframe termina de cargar
    var frame = document.getElementById('app-frame');
    var overlay = document.getElementById('loading-overlay');

    function hideOverlay() {
      overlay.classList.add('hidden');
      // Remover completamente tras la transición
      setTimeout(function() {
        overlay.style.display = 'none';
      }, 350);
    }

    frame.addEventListener('load', function() {
      // Esperar un tick para que Streamlit pinte el primer frame
      setTimeout(hideOverlay, 800);
    });

    // Fallback: ocultar siempre después de 6 segundos máximo
    setTimeout(hideOverlay, 6000);
  </script>
</body>
</html>
