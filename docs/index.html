<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GZG MINERALES - Aprobaciones</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#121418">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GZG MINERALES">
  <meta name="application-name" content="GZG MINERALES">
  
  <link rel="manifest" href="manifest.json?v=18">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-192.png?v=18">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=18">
  <link rel="shortcut icon" href="assets/favicon.png?v=18">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #121418;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #app-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100dvh;
      overflow: hidden;
      background: #121418;
    }

    /* El iframe empieza invisible — solo se muestra cuando el overlay se oculta */
    #app-frame {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: calc(100% + 44px);
      border: 0; outline: 0;
      display: block;
      background: #121418;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #app-frame.visible { opacity: 1; }

    /* Overlay oscuro GZG — cubre mientras Streamlit carga */
    #loading-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100dvh;
      background: #121418;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #loading-overlay.fade-out {
      opacity: 0;
    }

    /* Logo GZG */
    .gzg-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .gzg-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #FFFFFF;
    }
    .gzg-title span { color: #F58220; }
    .gzg-sub {
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
    }

    /* Spinner naranja */
    .gzg-spinner {
      width: 32px; height: 32px;
      border: 2.5px solid rgba(245,130,32,0.2);
      border-top: 2.5px solid #F58220;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Overlay de carga — elimina parches/skeleton de Streamlit durante inicio -->
  <div id="loading-overlay">
    <div class="gzg-logo">
      <div class="gzg-title">GZG <span>MINERALES</span></div>
      <div class="gzg-sub">Control de Asistencia</div>
    </div>
    <div class="gzg-spinner"></div>
  </div>

  <div id="app-container">
    <iframe 
      id="app-frame" 
      src="https://gzg-aprobaciones-movil.streamlit.app/?embed=true"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write">
    </iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=35').then(function(reg) {
        reg.update();
      }).catch(function() {});
    }

    var overlay = document.getElementById('loading-overlay');
    var frame   = document.getElementById('app-frame');
    var shown   = false;

    function showApp() {
      if (shown) return;
      shown = true;
      // Mostrar el iframe
      frame.classList.add('visible');
      // Desvanecer overlay
      overlay.classList.add('fade-out');
      // Remover overlay del DOM tras la animacion
      setTimeout(function() {
        overlay.style.display = 'none';
      }, 450);
    }

    // Estrategia 1: PostMessage de Streamlit cuando el app termino de cargar
    window.addEventListener('message', function(ev) {
      if (ev.data && (
        ev.data.type === 'streamlit:ready' ||
        ev.data.type === 'streamlit:componentReady' ||
        (typeof ev.data === 'string' && ev.data.indexOf('ready') !== -1)
      )) {
        setTimeout(showApp, 300);
      }
    });

    // Estrategia 2: iframe load event
    frame.addEventListener('load', function() {
      setTimeout(showApp, 1500);
    });

    // Estrategia 3: Fallback garantizado — max 5 segundos
    setTimeout(showApp, 5000);
  </script>
</body>
</html>
