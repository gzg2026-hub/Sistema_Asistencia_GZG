<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GZG MINERALES</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#121418">
  <meta name="background-color" content="#121418">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GZG MINERALES">
  <meta name="application-name" content="GZG MINERALES">
  
  <!-- Icons & Manifest -->
  <link rel="manifest" href="manifest.json?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-192.png?v=4">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=4">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png?v=4">
  <link rel="shortcut icon" href="assets/favicon.png?v=4">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121418;
    }

    /* Contenedor que recorta la barra inferior 'Built with Streamlit' */
    #app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #121418;
      z-index: 1;
    }

    #app-frame {
      width: 100vw;
      /* Extra 50px para expulsar el footer de Streamlit fuera de la pantalla */
      height: calc(100dvh + 50px);
      border: none;
      outline: none;
      display: block;
      background-color: #121418;
      position: absolute;
      top: 0;
      left: 0;
    }

    #install-banner {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #F58220 0%, #D96A0B 100%);
      color: #FFFFFF;
      padding: 13px 26px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 14px;
      display: none;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(245, 130, 32, 0.55);
      z-index: 10000;
      cursor: pointer;
      border: none;
      outline: none;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Botón de instalación nativa de la App -->
  <button id="install-banner" onclick="installApp()">
    📲 Instalar App GZG
  </button>

  <!-- Contenedor que recorta la barra inferior de Streamlit -->
  <div id="app-container">
    <iframe 
      id="app-frame" 
      src="https://gzg-aprobaciones-movil.streamlit.app/?embed=true&embed_options=hide_footer&embed_options=disable_scrolling&embed_options=dark_theme"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write">
    </iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // Manejo de Instalación PWA
    let deferredPrompt;
    const installBtn = document.getElementById('install-banner');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'flex';
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            installBtn.style.display = 'none';
          }
          deferredPrompt = null;
        });
      }
    }

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
    });
  </script>
</body>
</html>
