<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GZG MINERALES</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#121418">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GZG MINERALES">

  <link rel="manifest" href="manifest.json?v=10">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-192.png?v=10">

  <link rel="shortcut icon" href="assets/favicon.png?v=10">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #121418;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #121418;
    }

    #app-frame {
      width: 100vw;
      height: 100dvh;
      border: 0;
      outline: 0;
      display: block;
      background-color: #121418;

<body>
  <div id="app-container">
    <iframe 
      id="app-frame" 
      src="https://gzg-aprobaciones-movil.streamlit.app/?embed=true"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write">
    </iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=8').catch(() => {});
    }
  </script>

</html>
